name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd scraper
        pip install -r requirements.txt
        cd ..

    - name: Run data scraper
      run: |
        cd scraper
        python scraper.py
        cd ..

    - name: Preprocess data
      run: |
        cd scraper
        python preprocessor.py
        cd ..

    - name: Convert CSV to JSON for dashboard
      run: python convert_to_json.py

    - name: Copy web folder to docs for GitHub Pages
      run: |
        rm -rf docs
        cp -r web docs

    - name: Commit and push docs folder
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/
        git commit -m "Update dashboard data" || echo "No changes to commit"
        git push

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        cname: ''
